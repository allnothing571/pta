name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    name: py${{ matrix.python }} on windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11"]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show interpreter
        run: |
          python -V
          python -c "import sys; print(sys.executable)"

      - name: Run the full suite
        # 项目只依赖标准库，没有 requirements.txt，装依赖这步可以省掉。
        # 测试与 demo 只碰临时工作区：PTA_HOME 指到 runner 的临时目录，
        # 绝不写 ~/.pta（runner 上下文只在 step 级 env 里可用，所以放在这里）。
        env:
          PTA_HOME: ${{ runner.temp }}/pta-home
        run: python run_tests.py
